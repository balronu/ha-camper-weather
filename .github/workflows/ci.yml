name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: python -m pip install --upgrade pytest ruff voluptuous aiohttp homeassistant==2026.10.1
      - run: PYTHONPATH=. python -m pytest -q
      - run: ruff check .
      - run: python -m compileall -q custom_components tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check custom_components/camper_weather/www/camper-weather-card.js
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: test -s frontend/dist/camper-weather-card.js
  frontend-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save --prefix frontend playwright@1.51.1
      - run: |
          CHROMIUM_PATH="$(command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROMIUM_PATH" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            CHROMIUM_PATH="$(command -v chromium || command -v chromium-browser)"
          fi
          test -x "$CHROMIUM_PATH"
          CHROMIUM_PATH="$CHROMIUM_PATH" node frontend/map-browser-test.mjs
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with: {category: integration}
